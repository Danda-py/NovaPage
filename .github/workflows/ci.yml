name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Postgres di servizio: serve al controllo dello schema, non ai test (unitari).
      DATABASE_URL: postgresql://postgres:password@localhost:5432/novapage
      AUTH_SECRET: ci-secret-non-reale
      NEXT_PUBLIC_SITE_URL: https://example.com
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: novapage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Schema del database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d novapage \
            -v ON_ERROR_STOP=1 -f db/schema.sql
          PGPASSWORD=password psql -h localhost -U postgres -d novapage \
            -v ON_ERROR_STOP=1 -f db/verify.sql
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: SEO audit
        run: |
          PORT=3111 npm start >/tmp/next.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3111/ >/dev/null && break; sleep 1; done
          node scripts/seo-audit.mjs --base-url=http://localhost:3111
      - name: Visual and a11y check
        run: |
          npx playwright install --with-deps chromium
          PORT=3112 npm start >/tmp/next2.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3112/ >/dev/null && break; sleep 1; done
          CHROME_PATH=$(find ~/.cache/ms-playwright -name chrome -type f | head -1) \
            node scripts/visual-check.mjs --base-url=http://localhost:3112 --path=/,/privacy
